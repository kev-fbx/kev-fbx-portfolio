    <div id="custom-cursor"></div>
    <script src="/src/js/cursor.js" defer></script>

    <script>
        (function() {
            const container = document.getElementById('gallery-container');
            if (!container) return;

            fetch('/gallery_data.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(items => {
                    if (!items || items.length === 0) {
                        container.innerHTML =
                            '<p style="color:white;padding:2.5rem;text-align:center;">No gallery items found.</p>';
                        return;
                    }

                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';

                        let media;
                        if (item.type && item.type.startsWith('image/')) {
                            media = document.createElement('img');
                            media.src = item.src;
                            media.alt = item.caption || '';
                            media.loading = 'lazy';
                        } else if (item.type && item.type.startsWith('video/')) {
                            media = document.createElement('video');
                            media.src = item.src;
                            media.autoplay = true;
                            media.loop = true;
                            media.muted = true;
                            media.playsInline = true;
                            media.controls = false;
                            media.loading = 'lazy';
                        } else {
                            return;
                        }

                        div.appendChild(media);

                        const caption = document.createElement('div');
                        caption.className = 'caption';
                        caption.textContent = item.caption || '';
                        div.appendChild(caption);

                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    console.error('Gallery load error:', err);
                    container.innerHTML = `<p style="color:white;padding:2.5rem;text-align:center;">Could not load gallery data.</p>`;
                });

        })();
    </script>
</body>
